[package]
name = "mqnutd"
version = "0.1.0"
edition = "2021"
description = "MQTT connector for NUT protocol – lightweight UPS power-outage shutdown daemon"
license = "MIT"
repository = "https://github.com/lilyanavalley/mqnutd"

[[bin]]
name = "mqnutd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# MQTT client
rumqttc = "0.25"
# NUT (Network UPS Tools) client
rups = { version = "0.6", features = ["async"] }
# Serialisation / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
anyhow = "1"
thiserror = "2"
